<!DOCTYPE html>
<html lang="en" data-theme="light-mint">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color">
    <meta name="description" content="Page not found · Activity Tracker">
    <title>Page Not Found · Activity Tracker</title>
    <script>try{var reportProThemes=['light-lemon','light-olive','light-peach','light-orange','light-mint','dark-neon'];var reportProTheme=localStorage.getItem('reportpro-theme');if(!reportProThemes.includes(reportProTheme)){var oldReportProTheme=localStorage.getItem('theme');reportProTheme=oldReportProTheme==='dark'?'dark-neon':'light-mint';localStorage.setItem('reportpro-theme',reportProTheme);localStorage.removeItem('theme')}document.documentElement.setAttribute('data-theme',reportProTheme)}catch(e){document.documentElement.setAttribute('data-theme','light-mint')}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/theme.js"></script>
    <style>
      body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 420px at 12% -10%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 55%),var(--bg);color:var(--text)}
    </style>
  </head>
  <body>
    <main id="message">
      <h2>404</h2>
      <h1>Page not found</h1>
      <p>This file is not part of Activity Tracker. Check the address, or return to the app.</p>
      <a href="/">Back to Activity Tracker</a>
    </main>
  </body>
</html>
