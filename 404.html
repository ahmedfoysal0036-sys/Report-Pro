<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found · Activity Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background:
          radial-gradient(900px 420px at 12% -10%, rgba(79,70,229,.18), transparent 55%),
          #eef1f8;
        color: #0c1226;
      }
      #message {
        width: min(92vw, 420px); background: #fff; padding: 36px 28px;
        border-radius: 24px; border: 1px solid rgba(15,23,80,.08);
        box-shadow: 0 18px 40px rgba(15,23,80,.1);
      }
      #message h2 { margin: 0; color: #4f46e5; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
      #message h1 { font-size: 28px; letter-spacing: -.04em; margin: 8px 0 10px; }
      #message p { line-height: 1.55; margin: 0 0 22px; color: #3c4663; font-size: 14px; }
      #message a {
        display: block; text-align: center; background: linear-gradient(180deg, #4f46e5, #4338ca);
        text-decoration: none; color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 700;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #070b16; color: #eef2ff; }
        #message { background: #0f1629; border-color: rgba(148,163,184,.12); }
        #message p { color: #9aa6c4; }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page not found</h1>
      <p>This file is not part of Activity Tracker. Check the address, or return to the app.</p>
      <a href="/">Back to Activity Tracker</a>
    </div>
  </body>
</html>
