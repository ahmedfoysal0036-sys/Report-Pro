<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Daily Activity Report logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-out infinite}
.b2{animation-delay:.15s}.b3{animation-delay:.3s}
@keyframes grow{0%{transform:scaleY(0)}18%,92%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.line{stroke-dasharray:125;animation:draw 4s ease-out infinite}
@keyframes draw{0%,15%{stroke-dashoffset:125}38%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.head{animation:pop 4s ease-out infinite}
@keyframes pop{0%,36%{opacity:0}44%,92%{opacity:1}100%{opacity:1}}
.hand{transform-origin:134px 140px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bar,.line,.head,.hand{animation:none}}
</style>
<circle cx="100" cy="100" r="94" fill="#fff" stroke="#3B8FD9" stroke-width="6"/>
<rect class="bar" x="40" y="104" width="18" height="36" rx="4" fill="#6BB4EA"/>
<rect class="bar b2" x="62" y="88" width="18" height="52" rx="4" fill="#3B8FD9"/>
<rect class="bar b3" x="84" y="70" width="18" height="70" rx="4" fill="#2F6FB5"/>
<polyline class="line" points="38,96 66,72 84,84 132,48" fill="none" stroke="#2F6FB5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<polygon class="head" points="142,42 136,58 125,43" fill="#2F6FB5"/>
<circle cx="134" cy="140" r="28" fill="#fff" stroke="#1D9E75" stroke-width="6"/>
<line x1="134" y1="140" x2="134" y2="124" stroke="#2F6FB5" stroke-width="5" stroke-linecap="round"/>
<line class="hand" x1="134" y1="140" x2="134" y2="120" stroke="#1D9E75" stroke-width="4" stroke-linecap="round"/>
<circle cx="134" cy="140" r="3.5" fill="#2F6FB5"/>
</svg>
